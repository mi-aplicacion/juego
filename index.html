<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego Espacial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #05070b;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            background: radial-gradient(circle, #1a1f2c 0%, #05070b 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        @media (min-width: 481px) {
            #game-container {
                height: 90vh;
                max-height: 850px;
                border-radius: 12px;
                box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            }
        }

        /* HUD Superior */
        #hud {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(11, 15, 25, 0.95);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 8px;
            margin: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            z-index: 10;
            flex-shrink: 0;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
        }

        /* Canvas del juego */
        #gameCanvas {
            flex-grow: 1;
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Controles Inferiores Completamente Visibles */
        #controls {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px 12px 10px;
            background: rgba(11, 15, 25, 0.98);
            border-top: 1px solid rgba(0, 255, 204, 0.4);
            gap: 10px;
            z-index: 10;
            flex-shrink: 0;
        }

        .control-btn {
            flex: 1;
            background: rgba(0, 255, 204, 0.12);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 12px 0;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.25);
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #fireBtn {
            background: rgba(255, 0, 85, 0.12);
            border-color: #ff0055;
            color: #ff0055;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.25);
            font-size: 0.95rem;
        }

        .control-btn:active {
            background: #00ffcc;
            color: #05070b;
            transform: scale(0.95);
        }

        #fireBtn:active {
            background: #ff0055;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD / Marcadores -->
        <div id="hud">
            <div class="hud-item">🎯 BAJAS: <span id="score">0</span></div>
            <div class="hud-item">🛡️ VIDA: <span id="lives">3</span></div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Controles -->
        <div id="controls">
            <button class="control-btn" id="leftBtn">◀</button>
            <button class="control-btn" id="fireBtn">⚡ FUEGO</button>
            <button class="control-btn" id="rightBtn">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- SISTEMA DE AUDIO (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'laser') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'explosion') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'levelup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        // Variables del juego
        let score = 0;
        let lives = 3;
        let enemySpeed = 2.0;
        let spawnInterval = 1900;
        let lastLevelMilestone = 0;

        let player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 70,
            width: 45,
            height: 45,
            speed: 6
        };

        let bullets = [];
        let enemies = [];

        let movingLeft = false;
        let movingRight = false;

        // Controles inferiores
        const leftBtn = document.getElementById("leftBtn");
        const rightBtn = document.getElementById("rightBtn");
        const fireBtn = document.getElementById("fireBtn");

        leftBtn.addEventListener("mousedown", () => movingLeft = true);
        leftBtn.addEventListener("mouseup", () => movingLeft = false);
        leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); movingLeft = true; });
        leftBtn.addEventListener("touchend", () => movingLeft = false);

        rightBtn.addEventListener("mousedown", () => movingRight = true);
        rightBtn.addEventListener("mouseup", () => movingRight = false);
        rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); movingRight = true; });
        rightBtn.addEventListener("touchend", () => movingRight = false);

        function disparar() {
            bullets.push({ x: player.x + player.width / 2 - 3, y: player.y, width: 6, height: 14, speed: 9 });
            playSound('laser');
        }

        fireBtn.addEventListener("click", disparar);
        fireBtn.addEventListener("touchstart", (e) => { e.preventDefault(); disparar(); });

        // Teclado PC
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") movingLeft = true;
            if (e.key === "ArrowRight" || e.key === "d") movingRight = true;
            if (e.key === " " || e.key === "ArrowUp") {
                if (!e.repeat) disparar();
            }
        });
        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") movingLeft = false;
            if (e.key === "ArrowRight" || e.key === "d") movingRight = false;
        });

        let enemyTimer = null;

        function resetEnemySpawner() {
            if (enemyTimer) clearInterval(enemyTimer);
            enemyTimer = setInterval(() => {
                enemies.push({
                    x: Math.random() * (canvas.width - 45),
                    y: -50,
                    width: 42,
                    height: 42,
                    speed: enemySpeed
                });
            }, spawnInterval);
        }

        resetEnemySpawner();

        function update() {
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x + (movingRight ? player.speed : 0) - (movingLeft ? player.speed : 0)));

            bullets.forEach((b, index) => {
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(index, 1);
            });

            enemies.forEach((e, index) => {
                e.y += e.speed;
                if (e.y > canvas.height) {
                    enemies.splice(index, 1);
                    lives--;
                    document.getElementById("lives").innerText = lives;
                    playSound('hit');
                    if (lives <= 0) {
                        alert("¡Juego terminado! Puntuación final: " + score);
                        score = 0;
                        lives = 3;
                        enemySpeed = 2.0;
                        spawnInterval = 1900;
                        lastLevelMilestone = 0;
                        resetEnemySpawner();
                        document.getElementById("score").innerText = score;
                        document.getElementById("lives").innerText = lives;
                    }
                }

                bullets.forEach((b, bIndex) => {
                    if (b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
                        enemies.splice(index, 1);
                        bullets.splice(bIndex, 1);
                        score++;
                        document.getElementById("score").innerText = score;
                        playSound('explosion');

                        if (score % 50 === 0 && score !== lastLevelMilestone) {
                            lastLevelMilestone = score;
                            enemySpeed += 0.6;
                            spawnInterval = Math.max(600, spawnInterval - 200);
                            resetEnemySpawner();
                            playSound('levelup');
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.font = "38px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🤖", player.x + player.width / 2, player.y + player.height / 2);

            ctx.fillStyle = "#ff0055";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff0055";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            enemies.forEach(e => {
                ctx.fillText("🛸", e.x + e.width / 2, e.y + e.height / 2);
            });

            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
