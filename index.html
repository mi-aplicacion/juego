<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego Espacial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #05070b;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 850px;
            background: radial-gradient(circle, #1a1f2c 0%, #05070b 100%);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            border: 2px solid rgba(0, 255, 204, 0.2);
        }

        @media (min-width: 481px) {
            #game-container {
                border-radius: 15px;
                height: 90vh;
            }
        }

        #hud {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(11, 15, 25, 0.9);
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
            font-size: 1rem;
            font-weight: bold;
            z-index: 10;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
        }

        #gameCanvas {
            flex-grow: 1;
            display: block;
            width: 100%;
            height: 100%;
        }

        #controls {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(11, 15, 25, 0.9);
            border-top: 1px solid rgba(0, 255, 204, 0.3);
            z-index: 10;
        }

        .control-btn {
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 12px 24px;
            font-size: 1.2rem;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            outline: none;
        }

        .control-btn:active {
            background: #00ffcc;
            color: #05070b;
            box-shadow: 0 0 20px #00ffcc;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="hud">
            <div class="hud-item">🎯 BAJAS: <span id="score">0</span></div>
            <div class="hud-item">🛡️ VIDA: <span id="lives">3</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="controls">
            <button class="control-btn" id="leftBtn">◀</button>
            <button class="control-btn" id="fireBtn">🔥</button>
            <button class="control-btn" id="rightBtn">▶</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let lives = 3;

        let player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 70,
            width: 50,
            height: 50,
            speed: 6
        };

        let bullets = [];
        let enemies = [];

        let movingLeft = false;
        let movingRight = false;

        // Controles táctiles y de mouse/teclado
        document.getElementById("leftBtn").addEventListener("mousedown", () => movingLeft = true);
        document.getElementById("leftBtn").addEventListener("mouseup", () => movingLeft = false);
        document.getElementById("leftBtn").addEventListener("touchstart", (e) => { e.preventDefault(); movingLeft = true; });
        document.getElementById("leftBtn").addEventListener("touchend", () => movingLeft = false);

        document.getElementById("rightBtn").addEventListener("mousedown", () => movingRight = true);
        document.getElementById("rightBtn").addEventListener("mouseup", () => movingRight = false);
        document.getElementById("rightBtn").addEventListener("touchstart", (e) => { e.preventDefault(); movingRight = true; });
        document.getElementById("rightBtn").addEventListener("touchend", () => movingRight = false);

        document.getElementById("fireBtn").addEventListener("click", () => {
            bullets.push({ x: player.x + player.width / 2 - 4, y: player.y, width: 8, height: 16, speed: 8 });
        });

        // Soporte para teclado en PC (Flechas o A/D)
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") movingLeft = true;
            if (e.key === "ArrowRight" || e.key === "d") movingRight = true;
            if (e.key === " " || e.key === "ArrowUp") {
                bullets.push({ x: player.x + player.width / 2 - 4, y: player.y, width: 8, height: 16, speed: 8 });
            }
        });
        window.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") movingLeft = false;
            if (e.key === "ArrowRight" || e.key === "d") movingRight = false;
        });

        // Generar enemigos (OVNIs)
        setInterval(() => {
            enemies.push({
                x: Math.random() * (canvas.width - 45),
                y: -50,
                width: 45,
                height: 45,
                speed: 2.5
            });
        }, 1800);

        function update() {
            if (movingLeft && player.x > 0) player.x -= player.speed;
            if (movingRight && player.x < canvas.width - player.width) player.x += player.speed;

            bullets.forEach((b, index) => {
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(index, 1);
            });

            enemies.forEach((e, index) => {
                e.y += e.speed;
                if (e.y > canvas.height) {
                    enemies.splice(index, 1);
                    lives--;
                    document.getElementById("lives").innerText = lives;
                    if (lives <= 0) {
                        alert("¡Juego terminado! Puntuación: " + score);
                        score = 0;
                        lives = 3;
                        document.getElementById("score").innerText = score;
                        document.getElementById("lives").innerText = lives;
                    }
                }

                bullets.forEach((b, bIndex) => {
                    if (b.x < e.x + e.width && b.x + b.width > e.x && b.y < e.y + e.height && b.y + b.height > e.y) {
                        enemies.splice(index, 1);
                        bullets.splice(bIndex, 1);
                        score++;
                        document.getElementById("score").innerText = score;
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar Robot (Jugador) estilo emoji/icono brillante
            ctx.font = "40px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🤖", player.x + player.width / 2, player.y + player.height / 2);

            // Dibujar Balas (Láseres)
            ctx.fillStyle = "#ff0055";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ff0055";
            bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

            // Dibujar Enemigos (OVNIs)
            enemies.forEach(e => {
                ctx.fillText("🛸", e.x + e.width / 2, e.y + e.height / 2);
            });

            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
