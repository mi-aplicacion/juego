<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego UFO</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050b14;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        /* Marcadores superiores (HUD) */
        .hud {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid #00ffcc33;
            background: rgba(0, 255, 204, 0.05);
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Área de juego (Canvas) */
        .game-container {
            flex: 1;
            position: relative;
            width: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #0b192c 0%, #050b14 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Controles inferiores perfectamente elevados y seguros */
        .controles {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 15px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
            background: #050b14;
            border-top: 1px solid #00ffcc33;
            gap: 10px;
        }

        .btn-control {
            flex: 1;
            background: transparent;
            border: 2px solid #00ffcc;
            color: #00ffcc;
            padding: 14px 0;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: background 0.1s, transform 0.1s;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        .btn-control:active {
            background: rgba(0, 255, 204, 0.3);
            transform: scale(0.95);
        }

        .btn-disparar {
            border-color: #ff3366;
            color: #ff3366;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.2);
        }

        .btn-disparar:active {
            background: rgba(255, 51, 102, 0.3);
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div class="hud">
        <span id="txt-bajas">🎯 BAJAS: 0</span>
        <span id="txt-vida">🛡️ VIDA: 3</span>
    </div>

    <!-- Canvas -->
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Botones de Control -->
    <div class="controles">
        <button class="btn-control" id="btnIzquierda">◀</button>
        <button class="btn-control btn-disparar" id="btnDisparar">⚡ FUEGO</button>
        <button class="btn-control" id="btnDerecha">▶</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', ajustarCanvas);
        ajustarCanvas();

        let bajas = 0;
        let vida = 3;

        // Configuración del Jugador (Robot)
        const jugador = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 75,
            ancho: 45,
            alto: 45,
            velocidad: 6,
            moviendoIzquierda: false,
            moviendoDerecha: false
        };

        let balas = [];
        let ovnis = [];
        let contadorCreacionOvni = 0;

        // Generador de sonidos integrados (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function reproducirSonido(tipo) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (tipo === 'disparo') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (tipo === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        // Manejo de controles táctiles y de mouse
        const configurarBoton = (id, accionInicio, accionFin) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); accionInicio(); });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); accionFin(); });
            btn.addEventListener('mousedown', accionInicio);
            btn.addEventListener('mouseup', accionFin);
        };

        configurarBoton('btnIzquierda', () => jugador.moviendoIzquierda = true, () => jugador.moviendoIzquierda = false);
        configurarBoton('btnDerecha', () => jugador.moviendoDerecha = true, () => jugador.moviendoDerecha = false);

        const btnDisparar = document.getElementById('btnDisparar');
        btnDisparar.addEventListener('touchstart', (e) => { e.preventDefault(); disparar(); });
        btnDisparar.addEventListener('mousedown', disparar);

        function disparar() {
            balas.push({
                x: jugador.x + jugador.ancho / 2 - 3,
                y: jugador.y,
                ancho: 6,
                alto: 16,
                velocidad: 9
            });
            reproducirSonido('disparo');
        }

        function crearOvni() {
            const anchoOvni = 40;
            const xAleatoria = Math.random() * (canvas.width - anchoOvni);
            ovnis.push({
                x: xAleatoria,
                y: -40,
                ancho: anchoOvni,
                alto: 35,
                // Velocidad reducida considerablemente para que bajen de forma suave
                velocidad: 0.8 + Math.random() * 0.8
            });
        }

        function actualizar() {
            // Movimiento lateral del jugador
            if (jugador.moviendoIzquierda && jugador.x > 0) {
                jugador.x -= jugador.velocidad;
            }
            if (jugador.moviendoDerecha && jugador.x < canvas.width - jugador.ancho) {
                jugador.x += jugador.velocidad;
            }

            // Actualizar posiciones de las balas
            for (let i = balas.length - 1; i >= 0; i--) {
                balas[i].y -= balas[i].velocidad;
                if (balas[i].y < 0) {
                    balas.splice(i, 1);
                }
            }

            // Generación periódica de OVNIs (intervalo mayor para dar respiro)
            contadorCreacionOvni++;
            if (contadorCreacionOvni > 90) {
                crearOvni();
                contadorCreacionOvni = 0;
            }

            // Actualizar OVNIs y verificar colisiones
            for (let i = ovnis.length - 1; i >= 0; i--) {
                ovnis[i].y += ovnis[i].velocidad;

                // Si el OVNI llega al fondo (se escapa)
                if (ovnis[i].y > canvas.height) {
                    ovnis.splice(i, 1);
                    vida--;
                    document.getElementById('txt-vida').innerText = `🛡️ VIDA: ${vida}`;
                    if (vida <= 0) {
                        alert('¡Juego Terminado! Inténtalo de nuevo.');
                        bajas = 0;
                        vida = 3;
                        document.getElementById('txt-bajas').innerText = `🎯 BAJAS: ${bajas}`;
                        document.getElementById('txt-vida').innerText = `🛡️ VIDA: ${vida}`;
                    }
                    continue;
                }

                // Detección de colisión: Bala vs OVNI
                for (let j = balas.length - 1; j >= 0; j--) {
                    if (
                        balas[j].x < ovnis[i].x + ovnis[i].ancho &&
                        balas[j].x + balas[j].ancho > ovnis[i].x &&
                        balas[j].y < ovnis[i].y + ovnis[i].alto &&
                        balas[j].y + balas[j].alto > ovnis[i].y
                    ) {
                        // Impacto exitoso
                        ovnis.splice(i, 1);
                        balas.splice(j, 1);
                        bajas++;
                        document.getElementById('txt-bajas').innerText = `🎯 BAJAS: ${bajas}`;
                        reproducirSonido('explosion');
                        break;
                    }
                }
            }
        }

        function dibujar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar Jugador (Robot)
            ctx.font = '38px sans-serif';
            ctx.fillText('🤖', jugador.x, jugador.y + 35);

            // Dibujar Balas
            ctx.fillStyle = '#ff3366';
            for (let bala of balas) {
                ctx.fillRect(bala.x, bala.y, bala.ancho, bala.alto);
            }

            // Dibujar OVNIs
            ctx.font = '36px sans-serif';
            for (let ovni of ovnis) {
                ctx.fillText('🛸', ovni.x, ovni.y + 32);
            }
        }

        function buclePrincipal() {
            actualizar();
            dibujar();
            requestAnimationFrame(buclePrincipal);
        }

        buclePrincipal();
    </script>
</body>
</html>
